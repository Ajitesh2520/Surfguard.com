<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurfGuard</title>
  </head>
  <body>
    <main>
      <h1>SurfGuard</h1>
      <form id="login-form">
        <label>
          Email
          <input id="email" type="email" autocomplete="username" required />
        </label>
        <label>
          Password
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
            minlength="8"
          />
        </label>
        <button type="submit">Connect</button>
        <p id="login-error" class="error" hidden></p>
      </form>
      <div id="signed-in" hidden>
        <p id="status">Connected. SurfGuard will nudge, warn, or pause off-goal pages during a session.</p>
        <button id="logout" type="button">Disconnect</button>
      </div>
      <p>Recent local activity</p>
      <ul id="events"></ul>
      <p id="empty">No events yet. Switch tabs or visit a site.</p>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
